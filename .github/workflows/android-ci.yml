name: Android CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      # gradlew is committed without the executable bit
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK and run unit tests
        run: ./gradlew :app:assembleRepoDebug :app:testRepoDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: redomi-repo-debug-apk
          path: app/build/outputs/apk/repo/debug/*.apk
          if-no-files-found: error
